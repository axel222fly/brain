name: Build Sal for iOS and macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode and verify
        run: |
          ls /Applications/ | grep Xcode
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          xcodebuild -version

      - name: Configure Git for CI
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global advice.detachedHead false

      - name: Diagnose project structure
        run: |
          ls -la
          find . -name "*.xcodeproj" -maxdepth 2
          xcodebuild -project Sal.xcodeproj -list

      - name: Resolve Swift Package Dependencies
        env:
          SWIFTPM_DISABLE_DEPENDENCY_CACHE: 1
        run: |
          xcodebuild -resolvePackageDependencies \
            -scmProvider system \
            -project Sal.xcodeproj \
            -scheme Sal

      - name: Build Unsigned iOS Archive
        run: |
          xcodebuild -project Sal.xcodeproj \
            -scheme Sal \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Sal.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/Sal.xcarchive/Products/Applications/Sal.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r Sal-unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sal-ios-ipa
          path: $RUNNER_TEMP/Sal-unsigned.ipa

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode and verify
        run: |
          ls /Applications/ | grep Xcode
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          xcodebuild -version

      - name: Configure Git for CI
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global advice.detachedHead false

      - name: Diagnose project structure
        run: |
          ls -la
          find . -name "*.xcodeproj" -maxdepth 2
          xcodebuild -project Sal.xcodeproj -list

      - name: Resolve Swift Package Dependencies
        env:
          SWIFTPM_DISABLE_DEPENDENCY_CACHE: 1
        run: |
          xcodebuild -resolvePackageDependencies \
            -scmProvider system \
            -project Sal.xcodeproj \
            -scheme Sal

      - name: Build macOS App
        run: |
          xcodebuild -project Sal.xcodeproj \
            -scheme Sal \
            -configuration Release \
            -sdk macosx \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -verbose

      - name: Package .app Bundle
        run: |
          mkdir -p $RUNNER_TEMP/Sal.app
          cp -r $RUNNER_TEMP/DerivedData/Build/Products/Release/Sal.app $RUNNER_TEMP/

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sal-macos-app
          path: $RUNNER_TEMP/Sal.app
