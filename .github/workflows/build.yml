name: Build Sal for iOS and macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Unsigned iOS Archive
        run: |
          xcodebuild -project Sal.xcodeproj \
            -scheme Sal \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Sal.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/Sal.xcarchive/Products/Applications/Sal.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r Sal-unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sal-ios-ipa
          path: $RUNNER_TEMP/Sal-unsigned.ipa

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build macOS App
        run: |
          xcodebuild -project Sal.xcodeproj \
            -scheme Sal \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .app Bundle
        run: |
          mkdir -p $RUNNER_TEMP/Sal.app
          cp -r $RUNNER_TEMP/DerivedData/Build/Products/Release/Sal.app $RUNNER_TEMP/

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sal-macos-app
          path: $RUNNER_TEMP/Sal.app
